name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  NIX_INSTALLER_DIAGNOSTIC_ENDPOINT: ""

jobs:
  ci:
    name: Build, test, lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build
        run: nix develop --command make build

      - name: Test
        run: nix develop --command make test

      - name: Lint
        run: nix develop --command make lint

      - name: Verify release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: nix develop --command make release-check RELEASE_TAG="$RELEASE_TAG"

      - name: Upload unsigned build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: firefox-extension-unsigned
          path: dist/chatgpt-thread-exporter-firefox.xpi
          if-no-files-found: error
          retention-days: 14
          # XPI is already a ZIP archive, so recompressing it only wastes CPU.
          compression-level: 0

      - name: Archive source for Mozilla
        if: github.ref_type == 'tag'
        run: |
          mkdir -p release
          git archive --format=zip --output=release/chatgpt-thread-exporter-source.zip "$GITHUB_SHA"
          zip -q -d release/chatgpt-thread-exporter-source.zip extension/manifest.json
          zip -q release/chatgpt-thread-exporter-source.zip extension/manifest.json

      - name: Upload release assets
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: firefox-release
          path: release/chatgpt-thread-exporter-source.zip
          if-no-files-found: error
          retention-days: 14
          # The source archive is already compressed.
          compression-level: 0

  submit:
    name: Submit to Mozilla Add-ons
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: firefox-release
          path: release

      - name: Build
        run: nix develop --command make build

      - name: Submit extension to Mozilla Add-ons
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          nix develop --command web-ext sign \
            --source-dir extension \
            --ignore-files "*.ts" "*.d.ts" \
            --channel listed \
            --upload-source-code release/chatgpt-thread-exporter-source.zip \
            --approval-timeout 0 \
            --no-config-discovery \
            --no-input

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: submit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: firefox-release
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/chatgpt-thread-exporter-source.zip \
            --repo "$REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
