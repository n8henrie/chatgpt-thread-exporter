name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  NIX_INSTALLER_DIAGNOSTIC_ENDPOINT: ""

jobs:
  ci:
    name: Build, test, lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build
        run: nix develop --command make build

      - name: Test
        run: nix develop --command make test

      - name: Lint
        run: nix develop --command make lint

      - name: Verify release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: nix develop --command make release-check RELEASE_TAG="$RELEASE_TAG"

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v7
        with:
          name: firefox-extension
          path: dist/chatgpt-thread-exporter-firefox.xpi
          if-no-files-found: error
          retention-days: 14
          # XPI is already a ZIP archive, so recompressing it only wastes CPU.
          compression-level: 0

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Firefox extension
        uses: actions/download-artifact@v8
        with:
          name: firefox-extension
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/chatgpt-thread-exporter-firefox.xpi \
            --repo "$REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
